name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: psdte
          POSTGRES_PASSWORD: psdte
          POSTGRES_DB: psdte
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U psdte -d psdte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:cov

      - name: Crear base de datos de test
        run: PGPASSWORD=psdte psql -h localhost -U psdte -d psdte -c 'CREATE DATABASE psdte_test;'

      - name: Migraciones + seeds (test)
        run: pnpm --filter @psdte/api db:reset:test

      - name: Integración/E2E API
        run: pnpm --filter @psdte/api test:e2e

      - name: Playwright — instalar Chromium
        run: pnpm --filter @psdte/web exec playwright install --with-deps chromium

      - name: E2E web (Playwright, headless)
        run: pnpm --filter @psdte/web test:e2e

      - name: pnpm audit (prod deps)
        run: pnpm audit --prod || echo "::warning::pnpm audit reportó hallazgos, revisar antes de release"

      - name: Validar manifests K8s (kubernetes-validate, sustituto de kubeconform — ver ADR-031)
        run: |
          pip install --quiet kubernetes-validate
          python3 - <<'PY'
          import sys, glob, yaml
          import kubernetes_validate as kv

          archivos = sorted(glob.glob('infra/k8s/base/*.yaml')) + sorted(glob.glob('infra/k8s/postgres/*.yaml'))
          errores = 0
          for ruta in archivos:
              with open(ruta) as f:
                  docs = list(yaml.safe_load_all(f))
              for doc in docs:
                  if doc is None:
                      continue
                  kind = doc.get('kind', '?')
                  name = doc.get('metadata', {}).get('name', '?')
                  try:
                      kv.validate(doc, '1.32.0', strict=True)
                  except (kv.ValidationError, kv.SchemaNotFoundError) as e:
                      errores += 1
                      print(f'FALLA {ruta} [{kind}/{name}]: {e}')
          sys.exit(1 if errores else 0)
          PY
