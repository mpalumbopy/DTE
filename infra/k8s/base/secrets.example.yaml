# PLANTILLA — no aplicar tal cual. Copiar a secrets.yaml (gitignored) y completar valores reales,
# o crear el Secret directamente con `kubectl create secret generic psdte-secrets --from-literal=...`
# (ver docs/RUNBOOK.md, sección "Secretos"). stringData acepta texto plano (kubectl lo codifica).
apiVersion: v1
kind: Secret
metadata:
  name: psdte-secrets
  namespace: psdte
type: Opaque
stringData:
  DATABASE_URL: 'postgres://psdte:CAMBIAR@postgres:5432/psdte'
  REDIS_URL: 'redis://redis:6379/0'
  # PEM RS256 codificado en base64 (ver apps/api/src/config/config.schema.ts#decodificarPem) —
  # generar con: openssl genrsa 4096 | base64 -w0
  JWT_PRIVATE_KEY: 'CAMBIAR-base64-de-clave-privada-PEM'
  JWT_PUBLIC_KEY: 'CAMBIAR-base64-de-clave-publica-PEM'
  # 32 bytes en base64: openssl rand -base64 32
  APP_ENCRYPTION_KEY: 'CAMBIAR-32-bytes-base64'
  # aleatorio, ej: openssl rand -hex 32
  HMAC_CALLBACK_SECRET: 'CAMBIAR-secreto-aleatorio'
  SMTP_USER: ''
  SMTP_PASS: ''
  # Solo la usa infra/k8s/postgres/statefulset.yaml (dev/demo) — en prod ese StatefulSet ni se
  # aplica, así que esta clave puede omitirse del Secret real de producción.
  POSTGRES_PASSWORD_DEV: 'CAMBIAR'
